name: Build unsigned iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck + unit tests (core)
        run: npx tsc --noEmit && npx vitest run

      - name: Build core bundle
        run: npm run build:core

      - name: Build web assets (-> www)
        run: npm run build:web

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor (copies web + pod install)
        run: npx cap sync ios

      - name: Add Live Activities widget extension
        env:
          # Ta sama para wartości co niżej w xcodebuild — rozszerzenie MUSI mieć
          # wersję identyczną z aplikacją, inaczej iOS odrzuca je przy instalacji.
          ET_BUILD_NUMBER: ${{ github.run_number }}
          ET_MARKETING_VERSION: 1.0.${{ github.run_number }}
        run: |
          set -e
          gem install xcodeproj --no-document
          ruby scripts/ios-add-widgets.rb
          # ponowny pod install — projekt zmieniony po dodaniu targetu
          cd ios/App && pod install

      - name: Build unsigned archive
        run: |
          set -eo pipefail
          # Unikalna wersja per build. Bez tego każdy .ipa wyglądał dla iOS/AltStore
          # identycznie (stale 1.0/1), przez co instalacja potrafiła nie podmienić
          # już zainstalowanej aplikacji — telefon zostawał na starym wydaniu.
          # Przekazane jako build settings, więc obejmuje aplikację i widget naraz.
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            archive \
            MARKETING_VERSION="1.0.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Verify app and widget versions match
        run: |
          set -e
          # Rozjazd wersji między aplikacją a rozszerzeniem to cicha awaria instalacji
          # na urządzeniu — łapiemy to w CI, zanim trafi na telefon.
          APP_PLIST="build/App.xcarchive/Products/Applications/App.app/Info.plist"
          EXT_PLIST="build/App.xcarchive/Products/Applications/App.app/PlugIns/EasyTrainingWidgets.appex/Info.plist"
          get() { /usr/libexec/PlistBuddy -c "Print :$2" "$1" 2>/dev/null || echo "BRAK"; }
          APP_V=$(get "$APP_PLIST" CFBundleVersion); APP_S=$(get "$APP_PLIST" CFBundleShortVersionString)
          echo "Aplikacja: $APP_S ($APP_V)"
          if [ -f "$EXT_PLIST" ]; then
            EXT_V=$(get "$EXT_PLIST" CFBundleVersion); EXT_S=$(get "$EXT_PLIST" CFBundleShortVersionString)
            echo "Widget:    $EXT_S ($EXT_V)"
            [ "$APP_V" = "$EXT_V" ] && [ "$APP_S" = "$EXT_S" ] || { echo "BŁĄD: wersje aplikacji i widgetu się różnią"; exit 1; }
          else
            echo "UWAGA: nie znaleziono rozszerzenia widgetu w archiwum"
          fi
          [ "$APP_V" = "${{ github.run_number }}" ] || { echo "BŁĄD: numer buildu nie został nadpisany"; exit 1; }
          echo "OK — wersje zgodne i unikalne dla tego buildu"

      - name: Package .ipa (unsigned)
        run: |
          set -e
          APP_DIR="build/App.xcarchive/Products/Applications"
          test -d "$APP_DIR/App.app" || { echo "App.app not found"; ls -R build/App.xcarchive/Products || true; exit 1; }
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_DIR/App.app" Payload/App.app
          zip -r -y "EasyTraining-unsigned.ipa" Payload >/dev/null
          echo "Built:" && ls -lh EasyTraining-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyTraining-unsigned-ipa
          path: EasyTraining-unsigned.ipa
          if-no-files-found: error

  # Build pod symulator iOS (do testów w przeglądarce, np. appetize.io)
  build-simulator-app:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build core bundle
        run: npm run build:core

      - name: Build web assets (-> www)
        run: npm run build:web

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor (copies web + pod install)
        run: npx cap sync ios

      - name: Add Live Activities widget extension
        run: |
          set -e
          gem install xcodeproj --no-document
          ruby scripts/ios-add-widgets.rb
          cd ios/App && pod install

      - name: Build simulator .app
        run: |
          set -eo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/build/sim" \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Zip simulator app
        run: |
          set -e
          APP="build/sim/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP" || { echo "App.app not found"; find build/sim -name "*.app" -maxdepth 6 || true; exit 1; }
          cd "$(dirname "$APP")"
          zip -r -y "$GITHUB_WORKSPACE/EasyTraining-simulator.app.zip" App.app >/dev/null
          ls -lh "$GITHUB_WORKSPACE/EasyTraining-simulator.app.zip"

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyTraining-simulator-app
          path: EasyTraining-simulator.app.zip
          if-no-files-found: error
